name: Supabase Full Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Database
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --schema=public \
            --no-owner \
            --no-acl \
            -f quickpin-database-backup.sql
          ls -lh quickpin-database-backup.sql

      - name: Download Edge Functions
        run: |
          supabase functions download --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload Database Backup
        uses: actions/upload-artifact@v4
        with:
          name: quickpin-database-backup
          path: quickpin-database-backup.sql
          retention-days: 90

      - name: Upload Functions Backup
        uses: actions/upload-artifact@v4
        with:
          name: quickpin-functions-backup
          path: supabase/functions/
          retention-days: 90
